version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # 1.8.8 ships obfuscated code (computed require() paths) that breaks the
      # Turbopack build of /api/cron/sync and cannot be reviewed. The package
      # handles Garmin credentials — stay pinned until a readable release exists.
      - dependency-name: "@gooin/garmin-connect"
    groups:
      # One PR for the usual patch noise instead of a dozen.
      minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
